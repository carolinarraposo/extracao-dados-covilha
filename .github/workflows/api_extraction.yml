name: Data Extraction
on:
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run extractors
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python run_extractors.py

      - name: Upload data to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install boto3
          python - <<'EOF'
          import boto3
          import os
          from pathlib import Path

          client = boto3.client(
              "s3",
              endpoint_url=os.getenv("R2_ENDPOINT_URL"),
              aws_access_key_id=os.getenv("R2_ACCESS_KEY_ID"),
              aws_secret_access_key=os.getenv("R2_SECRET_ACCESS_KEY"),
              region_name="auto",
          )

          bucket = os.getenv("R2_BUCKET_NAME")

          files = [
              "data/raw/news_posts.json",
              "data/raw/reddit_posts_clean.json",
              "data/raw/bluesky_posts.json",
              "data/raw/youtube_posts.json",
              "data/raw/facebook_test.json",
          ]

          for file_path in files:
              path = Path(file_path)
              if not path.exists():
                  print(f"AVISO: {file_path} não encontrado, a saltar")
                  continue
              client.upload_file(
                  str(path),
                  bucket,
                  file_path,
              )
              print(f"Upload OK: {file_path}")

          print("Upload para R2 concluído")
          EOF

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/raw data/state
          git commit -m "update extracted data" || echo "No changes to commit"
          git push

      - name: Trigger context import in agent repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          repository: carolinarraposo/agente-gestao-incidentes
          event-type: new-extraction-data